server.port=8080

# Application Details
spring.application.name=SmartDine

# Default Database: Embedded H2 for zero-configuration, instant out-of-the-box run
spring.datasource.url=jdbc:h2:mem:smartdinedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Google OAuth & Security Settings (Environment variables with safe defaults)
smartdine.security.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
smartdine.security.jwt.expiration-ms=86400000
smartdine.oauth.google.client-id=${GOOGLE_CLIENT_ID:smartdine-google-oauth-demo-client-id}
smartdine.maps.google.api-key=${GOOGLE_MAPS_API_KEY:mock-google-maps-api-key}

# Static Resources
spring.web.resources.static-locations=classpath:/static/
